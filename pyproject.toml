[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automitigate"
version = "0.1.0"
description = "A bandit that chooses which error-mitigation settings to use on a quantum computer, per circuit and per machine, from a mirror-circuit score that needs no ideal answer."
readme = "README.md"
authors = [{ name = "Ian Wilson" }, { name = "Thomas Sebahi" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "qiskit>=2.5.2,<3",
  "numpy",
  "pandas>=2.2",
  "pyarrow",
]

[project.optional-dependencies]
sweep = [
  "qiskit-aer>=0.17.2",
  "scipy",
  "matplotlib",
  "scikit-learn>=1.5",
  "huggingface_hub",
]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["automitigate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
